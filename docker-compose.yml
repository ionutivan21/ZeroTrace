version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: zerotrace
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis

volumes:
  db_data:
